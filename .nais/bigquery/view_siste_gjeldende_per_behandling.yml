apiVersion: bigquery.cnrm.cloud.google.com/v1beta1
kind: BigQueryTable
metadata:
  name: view-siste-gjeldende-saksstatistikk
  namespace: aap
  labels:
    team: aap
  annotations:
    cnrm.cloud.google.com/management-conflict-prevention-policy: none
    cnrm.cloud.google.com/state-into-spec: absent
    cnrm.cloud.google.com/project-id: {{project}}
spec:
  resourceID: view_siste_gjeldende_hendelser_saksstatistikk
  description: "View som viser siste gjeldende hendelser i saksstatistikk."
  datasetRef:
    external: saksstatistikk
  view:
    useLegacySql: false
    query: >-
      WITH
        siste_fra_sak AS (
          SELECT
            *,
            row_number()
              OVER (PARTITION BY behandling_uuid ORDER BY endretTid DESC) AS rn
          FROM
            `aap-prod-9adc.saksstatistikk.view_gjeldende_hendelser_saksstatistikk` s
        )
      select * from siste_fra_sak s where rn = 1