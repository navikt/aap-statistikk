apiVersion: bigquery.cnrm.cloud.google.com/v1beta1
kind: BigQueryTable
metadata:
  name: view-meldekort
  namespace: aap
  labels:
    team: aap
  annotations:
    cnrm.cloud.google.com/management-conflict-prevention-policy: none
    cnrm.cloud.google.com/state-into-spec: absent
    cnrm.cloud.google.com/project-id: {{project}}
spec:
  resourceID: view_meldekort
  description: "View som viser meldekortdata."
  datasetRef:
    external: ytelsestatistikk
  view:
    useLegacySql: false
    query: >-
      WITH
          arbeid_per_meldekort AS (
            SELECT
              meldekort_id,
              ARRAY_AGG(
                STRUCT(
                  fra_dato,
                  til_dato,
                  timerarbeidet)) AS timer_arbeidet
            FROM `datastream_hendelser.public_arbeid_i_periode`
            GROUP BY meldekort_id
          )
        SELECT
          br.referanse AS behandlingsreferanse,
          s.saksnummer,
          m.journalpost_id,
          IFNULL(arb.timer_arbeidet, []) AS timer_arbeidet
        FROM `datastream_hendelser.public_meldekort` m
        JOIN `datastream_hendelser.public_behandling` b
          ON b.id = m.behandling_id
        JOIN `datastream_hendelser.public_sak` s
          ON s.id = b.sak_id
        JOIN `ytelsestatistikk.view_gyldige_behandlinger` gyldig
          ON gyldig.behandling_id = b.id
        JOIN `datastream_hendelser.public_behandling_referanse` br
          ON br.id = b.referanse_id
        left JOIN arbeid_per_meldekort arb
          ON arb.meldekort_id = m.id
