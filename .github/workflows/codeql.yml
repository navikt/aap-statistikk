name: "CodeQL"

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["kotlin"]
    env:
      GITHUB_PASSWORD: ${{ secrets.READER_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          build-mode: manual
          languages: ${{ matrix.language }}

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21.x'

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: wrapper

      - name: Build
        run: ./gradlew assemble --no-build-cache --no-configuration-cache -x detekt
        # temporary while waiting for kotlin 2.3 support in CodeQL FIXME
        continue-on-error: true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:${{matrix.language}}"

      - run: ./gradlew detektMain
        # temporary while waiting for kotlin 2.3 support in CodeQL FIXME
        continue-on-error: true

      - name: Upload Detekt SARIF
        # temporary while waiting for kotlin 2.3 support in CodeQL FIXME
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: app/build/reports/detekt/main.sarif
